name: Profile catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '8 19 * * *'
  push:
    branches: [main]
    paths:
      - 'README*'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'
  pull_request:
permissions:
  contents: read
concurrency:
  group: profile-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh both repository catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Geist-dev
        run: python scripts/update_readme.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- README.md README.ru.md; then
            echo 'Catalogs are current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md README.ru.md
            git commit -m 'docs: refresh bilingual repository catalogs'
            git push
          fi
